services:
  # Main FastAPI Backend
  - type: web
    name: wiyf-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8080
    rootDir: backend
    envVars:
      - key: WIYF_GEMINI_API_KEY
        sync: false # Set this securely in the Render dashboard
      - key: WIYF_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: WIYF_APP_ENV
        value: production
